name: Monthly snapshot

on:
  schedule:
    - cron: "0 12 2 * *"     # 2nd of every month, 12:00 UTC
  workflow_dispatch: {}      # also runnable by hand from the Actions tab

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Take snapshot and write report
        run: |
          python -m propwatch monthly | tee report.txt
      - name: Commit snapshot
        run: |
          git config user.name "propwatch-bot"
          git config user.email "propwatch-bot@users.noreply.github.com"
          git add snapshots/
          git commit -m "Monthly snapshot $(date +%Y-%m)" || echo "nothing new"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: monthly-report
          path: report.txt
